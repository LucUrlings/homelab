name: Deploy homelab

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: homelab-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    runs-on:
      - self-hosted
      - homelab
    timeout-minutes: 30

    steps:
      - name: Update deployment checkout
        working-directory: /home/luc/docker/homelab
        shell: bash
        run: |
          set -euo pipefail

          git fetch --prune origin main
          git merge --ff-only origin/main

      - name: Pull latest images
        working-directory: /home/luc/docker/homelab
        run: >-
          docker compose
          --env-file homelab-configs/.env
          -f docker-compose.main.yaml
          pull

      - name: Validate Compose configuration
        working-directory: /home/luc/docker/homelab
        run: >-
          docker compose
          --env-file homelab-configs/.env
          -f docker-compose.main.yaml
          config --quiet

      - name: Deploy stack
        working-directory: /home/luc/docker/homelab
        run: >-
          docker compose
          --env-file homelab-configs/.env
          -f docker-compose.main.yaml
          up -d
