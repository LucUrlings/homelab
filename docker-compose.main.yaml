networks:
  default:
    name: homelab_main_default
    driver: bridge
  socket_proxy:
    name: socket_proxy
    external: true
  t3_proxy:
    name: t3_proxy
    external: true

include:
  - $USERDIR/docker/homelab/active/timemachine.yaml
  - $USERDIR/docker/homelab/active/wizarr.yaml
  - $USERDIR/docker/homelab/active/lazylibrarian.yaml
  - $USERDIR/docker/homelab/active/umami.yaml
  - $USERDIR/docker/homelab/active/bugsink.yaml
  - $USERDIR/docker/homelab/active/lucurlings.nl.yaml
  - $USERDIR/docker/homelab/active/atlas.yaml
  - $USERDIR/docker/homelab/active/watch-watchtower.yaml
  - $USERDIR/docker/homelab/active/agent-devstation.yaml
  - $USERDIR/docker/homelab/active/minecraft.yaml
  - $USERDIR/docker/homelab/active/aveon.yaml

  # For backing up configs to Google Drive, see https://rclone.org/commands/rclone_sync/
  - $USERDIR/docker/homelab/active/rclone.yaml

  # Media stack
  - $USERDIR/docker/homelab/active/sonarr.yaml
  - $USERDIR/docker/homelab/active/radarr.yaml
  - $USERDIR/docker/homelab/active/prowlarr.yaml
  - $USERDIR/docker/homelab/active/jellyfin.yaml
  - $USERDIR/docker/homelab/active/seerr.yaml
  - $USERDIR/docker/homelab/active/whoami.yaml
  - $USERDIR/docker/homelab/active/sabnzbd.yaml
