name: ${WATCHTOWER_COMPOSE_PROJECT_NAME:-watchtower}

x-database-environment: &database-environment
  ConnectionStrings__Postgres: Host=watchtower-postgres;Port=5432;Database=${WATCHTOWER_POSTGRES_DB:-watchtower};Username=${WATCHTOWER_POSTGRES_USER:-watchtower};Password=${WATCHTOWER_POSTGRES_PASSWORD:?Set WATCHTOWER_POSTGRES_PASSWORD};GSS Encryption Mode=Disable

x-rabbitmq-environment: &rabbitmq-environment
  RabbitMq__Host: watchtower-rabbitmq
  RabbitMq__Port: "5672"
  RabbitMq__UserName: ${WATCHTOWER_RABBITMQ_USER:-watchtower}
  RabbitMq__Password: ${WATCHTOWER_RABBITMQ_PASSWORD:?Set WATCHTOWER_RABBITMQ_PASSWORD}

x-object-storage-environment: &object-storage-environment
  ObjectStorage__Endpoint: watchtower-minio:9000
  ObjectStorage__AccessKey: ${WATCHTOWER_MINIO_ROOT_USER:-watchtower}
  ObjectStorage__SecretKey: ${WATCHTOWER_MINIO_ROOT_PASSWORD:?Set WATCHTOWER_MINIO_ROOT_PASSWORD}
  ObjectStorage__Bucket: ${WATCHTOWER_MINIO_MEDIA_BUCKET:-watchtower-media}
  ObjectStorage__UseSsl: "false"

x-application-service: &application-service
  image: ${WATCHTOWER_IMAGE:-ghcr.io/lucurlings/watchtower}:${WATCHTOWER_IMAGE_TAG:-latest}
  pull_policy: always
  restart: unless-stopped
  networks:
    - watchtower-infrastructure

services:
  watchtower-postgres:
    container_name: ${WATCHTOWER_COMPOSE_PROJECT_NAME:-watchtower}-postgres
    image: ${WATCHTOWER_POSTGRES_IMAGE:-postgres:18.4-bookworm}
    environment:
      POSTGRES_DB: ${WATCHTOWER_POSTGRES_DB:-watchtower}
      POSTGRES_USER: ${WATCHTOWER_POSTGRES_USER:-watchtower}
      POSTGRES_PASSWORD: ${WATCHTOWER_POSTGRES_PASSWORD:?Set WATCHTOWER_POSTGRES_PASSWORD}
    volumes:
      - watchtower-postgres18-data:/var/lib/postgresql
    restart: unless-stopped
    networks:
      - watchtower-infrastructure
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${WATCHTOWER_POSTGRES_USER:-watchtower} -d ${WATCHTOWER_POSTGRES_DB:-watchtower}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  watchtower-rabbitmq:
    container_name: ${WATCHTOWER_COMPOSE_PROJECT_NAME:-watchtower}-rabbitmq
    image: ${WATCHTOWER_RABBITMQ_IMAGE:-rabbitmq:4.2.9-management-alpine}
    environment:
      RABBITMQ_DEFAULT_USER: ${WATCHTOWER_RABBITMQ_USER:-watchtower}
      RABBITMQ_DEFAULT_PASS: ${WATCHTOWER_RABBITMQ_PASSWORD:?Set WATCHTOWER_RABBITMQ_PASSWORD}
    # ports:
    #   - "${WATCHTOWER_MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${WATCHTOWER_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - watchtower-rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - watchtower-infrastructure
      - t3_proxy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity && rabbitmq-diagnostics -q check_local_alarms",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
    labels:
      - "traefik.enable=true"
      # HTTP Routers
      - "traefik.http.routers.watchtower-rabbitmq.entrypoints=websecure"
      - "traefik.http.routers.watchtower-rabbitmq.rule=Host(`watch-rabbitmq.$DOMAINNAME`)"
      # Middlewares
      - "traefik.http.routers.watchtower-rabbitmq.middlewares=chain-oauth@file"
      # Http Services
      - "traefik.http.routers.watchtower-rabbitmq.service=watchtower-rabbitmq-svc"
      - "traefik.http.services.watchtower-rabbitmq-svc.loadbalancer.server.port=15672"

  watchtower-flaresolverr:
    container_name: ${WATCHTOWER_COMPOSE_PROJECT_NAME:-watchtower}-flaresolverr
    image: ${WATCHTOWER_FLARESOLVERR_IMAGE:-ghcr.io/flaresolverr/flaresolverr:v3.5.0}
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      TZ: $TZ
    restart: unless-stopped
    networks:
      - watchtower-application
      - watchtower-infrastructure

  watchtower-minio:
    container_name: ${WATCHTOWER_COMPOSE_PROJECT_NAME:-watchtower}-minio
    image: ${WATCHTOWER_MINIO_IMAGE:-quay.io/minio/aistor/minio:RELEASE.2026-07-24T16-43-31Z}
    command:
      - server
      - --console-address
      - ":9001"
      - /data
      - --license
      - /minio.license
    environment:
      MINIO_ROOT_USER: ${WATCHTOWER_MINIO_ROOT_USER:-watchtower}
      MINIO_ROOT_PASSWORD: ${WATCHTOWER_MINIO_ROOT_PASSWORD:?Set WATCHTOWER_MINIO_ROOT_PASSWORD}
    # ports:
    #   - "${WATCHTOWER_MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${WATCHTOWER_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - watchtower-minio-data:/data
      - /home/luc/docker/homelab/homelab-configs/secrets/minio-watchtower/minio.license:/minio.license:ro
    restart: unless-stopped
    networks:
      - watchtower-infrastructure
      - t3_proxy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 18
    labels:
      - "traefik.enable=true"
      # HTTP Routers
      - "traefik.http.routers.watchtower-minio.entrypoints=websecure"
      - "traefik.http.routers.watchtower-minio.rule=Host(`watch-minio.$DOMAINNAME`)"
      # Middlewares
      - "traefik.http.routers.watchtower-minio.middlewares=chain-oauth@file"
      # Http Services
      - "traefik.http.routers.watchtower-minio.service=watchtower-minio-svc"
      - "traefik.http.services.watchtower-minio-svc.loadbalancer.server.port=9001"

  watchtower-migrator:
    <<: *application-service
    container_name: ${WATCHTOWER_COMPOSE_PROJECT_NAME:-watchtower}-migrator
    working_dir: /app/migrator
    entrypoint: ["dotnet", "/app/migrator/Watchtower.Migrator.dll"]
    environment:
      <<: *database-environment
      DOTNET_ENVIRONMENT: ${WATCHTOWER_DOTNET_ENVIRONMENT:-Production}
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      watchtower-postgres:
        condition: service_healthy

  watchtower-web:
    <<: *application-service
    container_name: ${WATCHTOWER_COMPOSE_PROJECT_NAME:-watchtower}-web
    environment:
      <<: [*database-environment, *object-storage-environment]
      ASPNETCORE_ENVIRONMENT: ${WATCHTOWER_ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "8080"
      AllowedHosts: ${WATCHTOWER_ALLOWED_HOSTS:-*}
      HEALTHCHECK_URL: http://127.0.0.1:8080/health
      Infrastructure__Enabled: "true"
      ManagementLinks__RabbitMq: ${WATCHTOWER_RABBITMQ_MANAGEMENT_URL:-}
      ManagementLinks__Minio: ${WATCHTOWER_MINIO_CONSOLE_URL:-}
      RabbitMqManagement__Endpoint: http://watchtower-rabbitmq:15672
      RabbitMqManagement__UserName: ${WATCHTOWER_RABBITMQ_USER:-watchtower}
      RabbitMqManagement__Password: ${WATCHTOWER_RABBITMQ_PASSWORD:?Set WATCHTOWER_RABBITMQ_PASSWORD}
      RabbitMqManagement__VirtualHost: /
    # ports:
    #   - "${WATCHTOWER_HTTP_BIND_ADDRESS:-127.0.0.1}:${WATCHTOWER_HTTP_PORT:-8080}:8080"
    networks:
      - watchtower-application
      - watchtower-infrastructure
      - t3_proxy
    depends_on:
      watchtower-migrator:
        condition: service_completed_successfully
      watchtower-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "Watchtower.Api.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    labels:
      - "traefik.enable=true"
      # HTTP Routers
      - "traefik.http.routers.watchtower.entrypoints=websecure"
      - "traefik.http.routers.watchtower.rule=Host(`watch.$DOMAINNAME`)"
      # Middlewares
      - "traefik.http.routers.watchtower.middlewares=chain-oauth@file"
      # Http Services
      - "traefik.http.routers.watchtower.service=watchtower-svc"
      - "traefik.http.services.watchtower-svc.loadbalancer.server.port=8080"

  watchtower-worker:
    <<: *application-service
    container_name: ${WATCHTOWER_COMPOSE_PROJECT_NAME:-watchtower}-worker
    working_dir: /app/worker
    entrypoint: ["dotnet", "/app/worker/Watchtower.Worker.dll"]
    environment:
      <<:
        [
          *database-environment,
          *rabbitmq-environment,
          *object-storage-environment,
        ]
      Chrono24__FlareSolverrEndpoint: http://watchtower-flaresolverr:8191/v1
      DOTNET_ENVIRONMENT: ${WATCHTOWER_DOTNET_ENVIRONMENT:-Production}
    networks:
      - watchtower-application
      - watchtower-infrastructure
    depends_on:
      watchtower-migrator:
        condition: service_completed_successfully
      watchtower-rabbitmq:
        condition: service_healthy
      watchtower-flaresolverr:
        condition: service_started
      watchtower-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "Watchtower.Worker.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  watchtower-scheduler:
    <<: *application-service
    container_name: ${WATCHTOWER_COMPOSE_PROJECT_NAME:-watchtower}-scheduler
    working_dir: /app/scheduler
    entrypoint: ["dotnet", "/app/scheduler/Watchtower.Scheduler.dll"]
    environment:
      <<: *database-environment
      DOTNET_ENVIRONMENT: ${WATCHTOWER_DOTNET_ENVIRONMENT:-Production}
    depends_on:
      watchtower-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "dotnet", "Watchtower.Scheduler.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  watchtower-postgres18-data:
    name: ${WATCHTOWER_COMPOSE_PROJECT_NAME:-watchtower}-postgres18-data
  watchtower-rabbitmq-data:
    name: ${WATCHTOWER_COMPOSE_PROJECT_NAME:-watchtower}-rabbitmq-data
  watchtower-minio-data:
    name: ${WATCHTOWER_COMPOSE_PROJECT_NAME:-watchtower}-minio-data

networks:
  watchtower-application:
    name: ${WATCHTOWER_COMPOSE_PROJECT_NAME:-watchtower}-application
    driver: bridge
  watchtower-infrastructure:
    name: ${WATCHTOWER_COMPOSE_PROJECT_NAME:-watchtower}-infrastructure
    driver: bridge
    internal: true
