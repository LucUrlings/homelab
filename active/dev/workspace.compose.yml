services:
  workspace:
    image: ${WORKSPACE_IMAGE:-ghcr.io/lucurlings/devctl-workspace:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      HOME: /home/developer
      PROJECT_NAME: ${PROJECT_NAME:?set PROJECT_NAME}
      REPO_URL: ${REPO_URL:?set REPO_URL}
      REPO_BRANCH: ${REPO_BRANCH:-}
      REPO_DEPTH: ${REPO_DEPTH:-}
      WORKSPACE_PATH: ${PROJECT_DIR:?set PROJECT_DIR}/repo
      PREVIEW_PORT: ${PREVIEW_PORT:-3000}
      DEVCTL_CODE_URL: https://${PROJECT_NAME}.code.${BASE_DOMAIN:?set BASE_DOMAIN}
      DEVCTL_PREVIEW_URL: https://${PROJECT_NAME}.dev.${BASE_DOMAIN:?set BASE_DOMAIN}
      CODEX_HOME: /home/developer/.codex
      CLAUDE_CONFIG_DIR: /home/developer/.claude
      GH_CONFIG_DIR: /home/developer/.config/gh
      HERDR_SOCKET_PATH: /run/herdr/herdr.sock
      CCGRAM_DIR: /srv/devctl/ccgram
    volumes:
      # Keep the host and container path identical so nested Docker Compose bind
      # mounts resolve correctly through the host Docker daemon.
      - ${PROJECT_DIR:?set PROJECT_DIR}/repo:${PROJECT_DIR:?set PROJECT_DIR}/repo
      - ${PROJECT_DIR:?set PROJECT_DIR}/ssh-host-keys:/etc/ssh/devctl-host-keys
      - ${PROJECT_DIR:?set PROJECT_DIR}/vscode-server:/home/developer/.vscode-server
      - /srv/devctl/shared/codex:/home/developer/.codex
      - /srv/devctl/shared/claude:/home/developer/.claude
      - /srv/devctl/shared/gh:/home/developer/.config/gh
      - /srv/devctl/ssh/authorized_keys:/etc/ssh/authorized_keys:ro
      - /srv/devctl/herdr/run:/run/herdr:ro
      - /srv/devctl/ccgram:/srv/devctl/ccgram
      # Host-equivalent Docker control. Use workspaces only for trusted code.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${SSH_PORT:?set SSH_PORT}:22"
    expose:
      - "8080"
      - "${PREVIEW_PORT:-3000}"
    networks:
      - traefik
    labels:
      - "devctl.managed=true"
      - "devctl.project=${PROJECT_NAME}"
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK}"
      - "traefik.http.routers.devctl-${PROJECT_NAME}-code.rule=Host(`${PROJECT_NAME}.code.${BASE_DOMAIN:?set BASE_DOMAIN}`)"
      - "traefik.http.routers.devctl-${PROJECT_NAME}-code.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.devctl-${PROJECT_NAME}-code.middlewares=${TRAEFIK_AUTH_MIDDLEWARE:?set TRAEFIK_AUTH_MIDDLEWARE}"
      - "traefik.http.routers.devctl-${PROJECT_NAME}-code.tls=true"
      - "traefik.http.routers.devctl-${PROJECT_NAME}-code.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-}"
      - "traefik.http.routers.devctl-${PROJECT_NAME}-code.service=devctl-${PROJECT_NAME}-code"
      - "traefik.http.services.devctl-${PROJECT_NAME}-code.loadbalancer.server.port=8080"
      - "traefik.http.routers.devctl-${PROJECT_NAME}-preview.rule=Host(`${PROJECT_NAME}.dev.${BASE_DOMAIN:?set BASE_DOMAIN}`)"
      - "traefik.http.routers.devctl-${PROJECT_NAME}-preview.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.devctl-${PROJECT_NAME}-preview.middlewares=${TRAEFIK_AUTH_MIDDLEWARE:?set TRAEFIK_AUTH_MIDDLEWARE}"
      - "traefik.http.routers.devctl-${PROJECT_NAME}-preview.tls=true"
      - "traefik.http.routers.devctl-${PROJECT_NAME}-preview.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-}"
      - "traefik.http.routers.devctl-${PROJECT_NAME}-preview.service=devctl-${PROJECT_NAME}-preview"
      - "traefik.http.services.devctl-${PROJECT_NAME}-preview.loadbalancer.server.port=${PREVIEW_PORT:-3000}"
    deploy:
      resources:
        limits:
          cpus: ${WORKSPACE_CPUS:-4}
          memory: ${WORKSPACE_MEMORY:-8G}
    healthcheck:
      test: ["CMD", "/usr/local/bin/workspace-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK}
