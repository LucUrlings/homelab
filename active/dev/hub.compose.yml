name: devctl-hub

services:
  herdr:
    image: ${HUB_IMAGE:-ghcr.io/lucurlings/devctl-hub:latest}
    command: ["herdr"]
    restart: unless-stopped
    environment:
      HOME: /root
      XDG_CONFIG_HOME: /srv/devctl
      HERDR_CONFIG_PATH: /srv/devctl/herdr/config.toml
      HERDR_SOCKET_PATH: /srv/devctl/herdr/run/herdr.sock
      CODEX_HOME: /srv/devctl/shared/codex
      CLAUDE_CONFIG_DIR: /srv/devctl/shared/claude
      GH_CONFIG_DIR: /srv/devctl/shared/gh
    volumes:
      - /srv/devctl/herdr:/srv/devctl/herdr
      - /srv/devctl/shared/codex:/srv/devctl/shared/codex
      - /srv/devctl/shared/claude:/srv/devctl/shared/claude
      - /srv/devctl/shared/gh:/srv/devctl/shared/gh
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      devctl.managed: "true"
      devctl.role: hub
    healthcheck:
      test: ["CMD", "/usr/local/bin/hub-healthcheck", "herdr"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 20s

  telegram:
    profiles: ["telegram"]
    image: ${HUB_IMAGE:-ghcr.io/lucurlings/devctl-hub:latest}
    command: ["ccgram"]
    restart: unless-stopped
    depends_on:
      herdr:
        condition: service_healthy
    environment:
      HOME: /home/developer
      CCGRAM_DIR: /srv/devctl/ccgram
      CCGRAM_MULTIPLEXER: herdr
      ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      CCGRAM_GROUP_ID: ${TELEGRAM_GROUP_ID:-}
      TELEGRAM_BOT_TOKEN_FILE: /srv/devctl/secrets/telegram-bot-token
      HERDR_SOCKET_PATH: /srv/devctl/herdr/run/herdr.sock
      CODEX_HOME: /srv/devctl/shared/codex
      CLAUDE_CONFIG_DIR: /srv/devctl/shared/claude
    volumes:
      - /srv/devctl/ccgram:/srv/devctl/ccgram
      - /srv/devctl/herdr/run:/srv/devctl/herdr/run
      - /srv/devctl/shared/codex:/srv/devctl/shared/codex
      - /srv/devctl/shared/claude:/srv/devctl/shared/claude
      - /srv/devctl/secrets:/srv/devctl/secrets:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/hub-healthcheck", "ccgram"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 20s
