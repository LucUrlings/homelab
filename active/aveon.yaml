services:
  aveon:
    image: ghcr.io/lucurlings/aveon:latest
    container_name: aveon
    mem_limit: 3g
    restart: unless-stopped
    depends_on:
      aveon-redis:
        condition: service_healthy
      aveon-postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AVEON_PUBLIC_URL: ${AVEON_PUBLIC_URL:?AVEON_PUBLIC_URL must be set}
      FlightApi__ApiKey: ${AVEON_FLIGHTAPI_API_KEY}
      FlightApi__MaxConcurrentRequests: ${FLIGHTAPI_MAX_CONCURRENT_REQUESTS:-5}
      FlightApi__MaxSchedulePages: ${FLIGHTAPI_MAX_SCHEDULE_PAGES:-10}
      Redis__ConnectionString: aveon-redis:6379
      Redis__FlightApiOneWayTtlMinutes: ${AVEON_REDIS_FLIGHT_API_ONE_WAY_TTL_MINUTES:-30}
      Redis__AirportDataTtlMinutes: ${AVEON_REDIS_AIRPORT_DATA_TTL_MINUTES:-10080}
      Redis__ExploreRoutesTtlMinutes: ${REDIS_EXPLORE_ROUTES_TTL_MINUTES:-10080}
      Redis__HeroRoutesTtlMinutes: ${REDIS_HERO_ROUTES_TTL_MINUTES:-43200}
      Redis__ExploreRoutesRetentionMinutes: ${REDIS_EXPLORE_ROUTES_RETENTION_MINUTES:-43200}
      Redis__HeroRoutesRetentionMinutes: ${REDIS_HERO_ROUTES_RETENTION_MINUTES:-129600}
      Redis__SearchSessionTtlMinutes: ${AVEON_REDIS_SEARCH_SESSION_TTL_MINUTES:-30}
      AirportCatalog__RefreshEnabled: ${AIRPORT_CATALOG_REFRESH_ENABLED:-true}
      AirportCatalog__SourceUrl: ${AIRPORT_CATALOG_SOURCE_URL:-https://raw.githubusercontent.com/mborsetti/airportsdata/main/airportsdata/airports.csv}
      AirportCatalog__RevisionApiUrl: ${AIRPORT_CATALOG_REVISION_API_URL:-https://api.github.com/repos/mborsetti/airportsdata/commits?path=airportsdata%2Fairports.csv&per_page=1}
      AirportCatalog__RevisionDownloadUrlTemplate: ${AIRPORT_CATALOG_REVISION_DOWNLOAD_URL_TEMPLATE:-https://raw.githubusercontent.com/mborsetti/airportsdata/{revision}/airportsdata/airports.csv}
      AirportCatalog__RefreshAgeDays: ${AIRPORT_CATALOG_REFRESH_AGE_DAYS:-30}
      Search__AnonymousMaxSearchCombinations: ${AVEON_SEARCH_ANONYMOUS_MAX_SEARCH_COMBINATIONS:-15}
      Search__UserMaxSearchCombinations: ${AVEON_SEARCH_USER_MAX_SEARCH_COMBINATIONS:-100}
      Search__ExecutionTimeoutMinutes: ${AVEON_SEARCH_EXECUTION_TIMEOUT_MINUTES:-10}
      MultiDestinationSearch__Enabled: ${AVEON_MULTI_DESTINATION_SEARCH_ENABLED:-true}
      MultiDestinationSearch__AnonymousMaxProviderCalls: ${AVEON_MULTI_DESTINATION_ANONYMOUS_MAX_PROVIDER_CALLS:-25}
      MultiDestinationSearch__UserMaxProviderCalls: ${AVEON_MULTI_DESTINATION_USER_MAX_PROVIDER_CALLS:-100}
      MultiDestinationSearch__AdminMaxProviderCalls: ${AVEON_MULTI_DESTINATION_ADMIN_MAX_PROVIDER_CALLS:-250}
      MultiDestinationSearch__ExecutionTimeoutMinutes: ${AVEON_MULTI_DESTINATION_EXECUTION_TIMEOUT_MINUTES:-10}
      MultiDestinationSearch__MaxActiveStates: ${AVEON_MULTI_DESTINATION_MAX_ACTIVE_STATES:-10000}
      MultiDestinationSearch__MaxEvaluatedStates: ${AVEON_MULTI_DESTINATION_MAX_EVALUATED_STATES:-500000}
      ConnectionStrings__Default: Host=aveon-postgres;Port=5432;Database=${AVEON_POSTGRES_DB:-aveon};Username=${AVEON_POSTGRES_USER:-aveon};Password=${AVEON_POSTGRES_PASSWORD:-aveon_dev_password}
    networks:
      - aveon-network
      - t3_proxy
    labels:
      - "traefik.enable=true"
      # HTTP Routers
      - "traefik.http.routers.aveon.entrypoints=websecure"
      - "traefik.http.routers.aveon.rule=Host(`aveon.$DOMAINNAME`)"
      # Middlewares
      # - "traefik.http.routers.aveon.middlewares=middlewares-basic-auth@file" # For Basic HTTP Authentication
      # Http Services
      - "traefik.http.routers.aveon.service=aveon-svc"
      - "traefik.http.services.aveon-svc.loadbalancer.server.port=8080"

  aveon-postgres:
    image: postgres:18-alpine
    container_name: aveon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AVEON_POSTGRES_DB:-aveon}
      POSTGRES_USER: ${AVEON_POSTGRES_USER:-aveon}
      POSTGRES_PASSWORD: ${AVEON_POSTGRES_PASSWORD:-aveon_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${AVEON_POSTGRES_USER:-aveon} -d $${AVEON_POSTGRES_DB:-aveon}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - aveon-postgres-data:/var/lib/postgresql
    networks:
      - aveon-network

  aveon-redis:
    image: redis:7-alpine
    mem_limit: 768m
    container_name: aveon-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - aveon-redis-data:/data
    networks:
      - aveon-network

volumes:
  aveon-redis-data:
  aveon-postgres-data:

networks:
  aveon-network: